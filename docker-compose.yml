# ontoMeta 一键部署：PostgreSQL + API + Frontend
# 用法（仓库根目录）：
#   docker compose up --build -d
# 访问：
#   前端 http://localhost:5180
#   API  http://localhost:8000  （/docs、/health）
# 可选 Redis：取消下方 redis 服务注释（当前草稿队列为进程内，不依赖 Redis）

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ontometa
      POSTGRES_PASSWORD: ontometa
      POSTGRES_DB: ontometa
    volumes:
      - ontometa_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontometa -d ontometa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ontometa:ontometa@postgres:5432/ontometa
      # 本 compose 是**本地演示栈**：库口令是写死的 ontometa:ontometa、5432 直接映射到
      # 宿主机、管理令牌用仓库里的公开默认值。DEBUG 默认开正是为了如实声明这一点——
      # 后端在 DEBUG 关闭时会拒绝用公开令牌启动（app/auth.py 的 enforce_bootstrap_secrets）。
      # 真要拿它上生产：注入随机 ONTOMETA_ADMIN_TOKEN 并设 DEBUG=false，届时那道闸会替你把关。
      ONTOMETA_ADMIN_TOKEN: ${ONTOMETA_ADMIN_TOKEN:-dev-admin-token-change-me}
      DEBUG: ${DEBUG:-true}
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-http://host.docker.internal:8080}
      DATAHUB_FRONTEND_URL: ${DATAHUB_FRONTEND_URL:-http://localhost:9002}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_KEY_HASH_PEPPER: ${API_KEY_HASH_PEPPER:-}
      MAX_CONCURRENT_DRAFT_GENERATIONS: ${MAX_CONCURRENT_DRAFT_GENERATIONS:-2}
      CORS_ORIGINS: '["http://localhost:5180","http://127.0.0.1:5180"]'
      # worker 数与连接池要一起调：连接数 = UVICORN_WORKERS × (DB_POOL_SIZE + DB_MAX_OVERFLOW)，
      # 默认 4 × (5 + 10) = 60，低于 Postgres 默认 max_connections=100。
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      # 结构化日志：容器里默认走 JSON，便于采集；本地开发不设这项，保持人读格式。
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5180:80"
    depends_on:
      - api

  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  ontometa_pg:
